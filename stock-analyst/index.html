<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #181c23;
    --border: #1f2430;
    --border2: #2a3040;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --accent-dim: rgba(59,130,246,0.15);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  header span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: auto;
  }

  /* Layout */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    min-width: 260px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 10px;
  }

  textarea#tickers {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.6;
  }
  textarea#tickers:focus { border-color: var(--accent); }
  textarea#tickers::placeholder { color: var(--muted); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }

  /* Depth selector */
  .depth-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .depth-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    padding: 8px 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .depth-btn:hover { border-color: var(--accent); color: var(--text); }
  .depth-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Focus toggles */
  .focus-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .focus-tag {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .focus-tag:hover { border-color: var(--accent); color: var(--text); }
  .focus-tag.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Analyze button */
  .analyze-btn {
    margin: 16px 20px 20px;
    width: calc(100% - 40px);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 11px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .analyze-btn:hover:not(:disabled) { background: #2563eb; transform: translateY(-1px); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* History */
  .history-list { padding: 8px; }
  .history-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .history-item:hover { background: var(--surface2); }
  .history-item.active { background: var(--accent-dim); }
  .history-ticker {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    min-width: 48px;
  }
  .history-time {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  /* Main content */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    text-align: center;
    padding: 60px;
  }
  .empty-icon { font-size: 48px; opacity: 0.4; }
  .empty-state h2 { font-size: 18px; font-weight: 500; color: var(--text); opacity: 0.6; }
  .empty-state p { font-size: 13px; line-height: 1.6; max-width: 340px; }

  /* Analysis card */
  .analysis-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.3s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
  }
  .card-ticker {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
  }
  .card-name {
    font-size: 13px;
    color: var(--muted);
  }
  .card-verdict {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .verdict-bullish { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .verdict-bearish { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }
  .verdict-neutral { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }

  .card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-text {
    font-size: 13.5px;
    line-height: 1.75;
    color: #cbd5e1;
  }

  /* Risks list */
  .risks-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .risk-item {
    display: flex;
    gap: 10px;
    font-size: 13px;
    line-height: 1.6;
    color: #cbd5e1;
  }
  .risk-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* Metrics table */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .metric-cell {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .metric-name {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .metric-value {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }
  .metric-cell.sentiment-good {
    background: var(--green-dim);
    border-color: rgba(34,197,94,0.3);
  }
  .metric-cell.sentiment-good .metric-value { color: var(--green); }
  .metric-cell.sentiment-neutral {
    background: rgba(99,102,241,0.08);
    border-color: rgba(99,102,241,0.2);
  }
  .metric-cell.sentiment-neutral .metric-value { color: #818cf8; }
  .metric-cell.sentiment-caution {
    background: var(--amber-dim);
    border-color: rgba(245,158,11,0.3);
  }
  .metric-cell.sentiment-caution .metric-value { color: var(--amber); }
  .metric-cell.sentiment-bad {
    background: var(--red-dim);
    border-color: rgba(239,68,68,0.3);
  }
  .metric-cell.sentiment-bad .metric-value { color: var(--red); }
  .metrics-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Verdict box */
  .verdict-box {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .verdict-box p { font-size: 13.5px; line-height: 1.75; color: #cbd5e1; }

  /* Loading */
  .loading-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeUp 0.3s ease both;
  }
  .loading-ticker {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--accent);
  }
  .loading-bar-wrap {
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    height: 3px;
  }
  .loading-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    animation: loadSlide 1.8s ease-in-out infinite;
    transform-origin: left;
  }
  @keyframes loadSlide {
    0% { width: 0%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .loading-status {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Error */
  .error-card {
    background: var(--red-dim);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 20px;
    color: var(--red);
    font-size: 13px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* Raw toggle */
  .raw-toggle {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    margin-left: auto;
    font-family: var(--mono);
    transition: all 0.15s;
  }
  .raw-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .raw-output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: #94a3b8;
    white-space: pre-wrap;
    max-height: 400px;
    overflow-y: auto;
  }

  .no-history { font-size: 12px; color: var(--muted); text-align: center; padding: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-icon">📈</div>
  <h1>Stock Analyst</h1>
  <span>powered by claude</span>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <label>Tickers</label>
      <textarea id="tickers" placeholder="SMCI&#10;NVDA, MSFT&#10;NFE"></textarea>
      <p class="hint">One per line or comma-separated. Up to 5 at a time.</p>
    </div>

    <div class="sidebar-section">
      <label>Analysis Depth</label>
      <div class="depth-grid">
        <button class="depth-btn" data-depth="quick">⚡ Quick</button>
        <button class="depth-btn active" data-depth="standard">📊 Standard</button>
        <button class="depth-btn" data-depth="deep">🔬 Deep Dive</button>
        <button class="depth-btn" data-depth="compare">⚖️ Compare</button>
      </div>
    </div>

    <div class="sidebar-section">
      <label>Focus Areas</label>
      <div class="focus-grid">
        <span class="focus-tag active" data-focus="fundamentals">Fundamentals</span>
        <span class="focus-tag active" data-focus="risks">Risks</span>
        <span class="focus-tag" data-focus="technicals">Technicals</span>
        <span class="focus-tag" data-focus="catalyst">Catalysts</span>
        <span class="focus-tag" data-focus="valuation">Valuation</span>
        <span class="focus-tag" data-focus="macro">Macro</span>
        <span class="focus-tag" data-focus="sentiment">Sentiment</span>
        <span class="focus-tag" data-focus="insiders">Insiders</span>
      </div>
    </div>

    <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">
      <span id="btnText">Analyze</span>
    </button>

    <div class="sidebar-section" style="flex:1">
      <label>History</label>
      <div class="history-list" id="historyList">
        <p class="no-history">No analyses yet</p>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainContent">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔭</div>
      <h2>Ready to analyse</h2>
      <p>Enter one or more tickers in the sidebar, choose your depth and focus areas, then hit Analyse.</p>
    </div>
  </main>
</div>

<script>
  let selectedDepth = 'standard';
  let selectedFocus = new Set(['fundamentals', 'risks']);
  let history = [];
  let currentSessionId = null;

  // Depth buttons
  document.querySelectorAll('.depth-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.depth-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDepth = btn.dataset.depth;
    });
  });

  // Focus tags
  document.querySelectorAll('.focus-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      tag.classList.toggle('active');
      if (tag.classList.contains('active')) selectedFocus.add(tag.dataset.focus);
      else selectedFocus.delete(tag.dataset.focus);
    });
  });

  function parseTickers(raw) {
    return raw.split(/[\n,]+/).map(t => t.trim().toUpperCase()).filter(Boolean).slice(0, 5);
  }

  function buildPrompt(ticker, depth, focusAreas) {
    const focusList = [...focusAreas].join(', ') || 'fundamentals, risks';
    const depthInstructions = {
      quick: 'Provide a concise 3–4 sentence thesis, 3 top risks, and a one-sentence verdict. Still include all available metrics from the required list.',
      standard: 'Provide a thorough thesis paragraph, 5–6 specific risks, and a clear 2-sentence verdict with a directional bias. Include all available metrics from the required list.',
      deep: 'Provide a detailed multi-paragraph thesis covering business model, competitive positioning, and growth vectors. List 8+ risks with severity ratings. Write a detailed verdict covering 12-month outlook, key price catalysts, and entry considerations. Include every available metric from the required list.',
      compare: 'You are comparing this stock to its closest peers. Include peer comparison where relevant in thesis, risks, and metrics. Include all available metrics from the required list.'
    };

    return `You are a senior equity analyst. Analyse the stock ticker: ${ticker}

Focus areas requested: ${focusList}
Analysis depth: ${depthInstructions[depth]}

Use web search to get the most current data available (price, recent earnings, news, guidance).

IMPORTANT: Always include ALL of the following metrics where applicable. Do NOT reduce the list:
Price, Market Cap, Revenue (TTM), Revenue Growth YoY, Gross Margin, Operating Margin, Net Margin,
EBITDA, EPS (TTM), EPS Growth YoY, P/E Ratio, Forward P/E, P/S Ratio, P/B Ratio, EV/EBITDA,
PEG Ratio, Free Cash Flow, FCF Yield, Debt/Equity, Net Cash/Debt, Current Ratio, ROE, ROA, ROIC,
Dividend Yield (if any), Short Interest, Institutional Ownership, Insider Ownership,
52-Week High, 52-Week Low, Beta, Analyst Consensus, Average Price Target.
Include every metric you can find data for. Aim for 20+ metrics.

For each metric, set sentiment to one of: "good", "neutral", "caution", "bad" —
judged in context of the company's sector and growth stage (e.g. high P/E is not automatically bad for a hypergrowth stock).

Respond ONLY with a valid JSON object — no markdown fences, no preamble. Format:
{
  "ticker": "${ticker}",
  "companyName": "Full company name",
  "verdict": "BULLISH" | "BEARISH" | "NEUTRAL",
  "thesis": "...",
  "risks": ["risk 1", "risk 2", ...],
  "metrics": [
    {"name": "Metric Name", "value": "X.Xx", "sentiment": "good"},
    ...
  ],
  "verdictSummary": "2–3 sentence conclusion with directional reasoning and key conditions to watch."
}

Use real, current data from web search. If a metric is unavailable, use "N/A" with sentiment "neutral".`;
  }

  function recoverPartialJSON(raw) {
    try {
      // Strip fences
      let s = raw.replace(/```json|```/g, '').trim();

      // Extract fields individually using regex so truncation in one field doesn't kill everything
      const get = (key) => {
        const m = s.match(new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)'));
        return m ? m[1] : null;
      };
      const ticker      = get('ticker');
      const companyName = get('companyName');
      const verdict     = get('verdict');
      const thesis      = get('thesis');
      const verdictSum  = get('verdictSummary');

      // Risks array
      let risks = [];
      const risksMatch = s.match(/"risks"\s*:\s*\[([\s\S]*?)\]/);
      if (risksMatch) {
        risks = [...risksMatch[1].matchAll(/"((?:[^"\\]|\\.)*)"/g)].map(m => m[1]);
      }

      // Metrics array — partial-safe: grab every complete metric object
      let metrics = [];
      const metricsSection = s.match(/"metrics"\s*:\s*\[([\s\S]*)/);
      if (metricsSection) {
        const raw = metricsSection[1];
        const metricMatches = [...raw.matchAll(/\{[^}]*"name"\s*:\s*"([^"]*)"[^}]*"value"\s*:\s*"([^"]*)"[^}]*(?:"sentiment"\s*:\s*"([^"]*)")?[^}]*\}/g)];
        metrics = metricMatches.map(m => ({ name: m[1], value: m[2], sentiment: m[3] || 'neutral' }));
      }

      if (!ticker && !companyName) return null; // nothing usable

      return {
        ticker:        ticker || '?',
        companyName:   companyName || '',
        verdict:       verdict || 'NEUTRAL',
        thesis:        thesis || '(Response was truncated — thesis unavailable)',
        risks,
        metrics,
        verdictSummary: verdictSum || '(Response was truncated — verdict unavailable)'
      };
    } catch(e) {
      return null;
    }
  }

  async function analyzeStock(ticker, depth, focusAreas) {
    const cardId = `card-${ticker}-${Date.now()}`;
    const main = document.getElementById('mainContent');
    document.getElementById('emptyState')?.remove();

    // Loading card
    const loadingEl = document.createElement('div');
    loadingEl.className = 'loading-card';
    loadingEl.id = cardId + '-loading';
    loadingEl.innerHTML = `
      <div class="loading-ticker">${ticker}</div>
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
      <div class="loading-status" id="${cardId}-status">Searching web for latest data…</div>
    `;
    main.prepend(loadingEl);

    const statuses = [
      'Searching web for latest data…',
      'Retrieving earnings & financials…',
      'Assessing risks & catalysts…',
      'Composing analysis…'
    ];
    let si = 0;
    const statusInterval = setInterval(() => {
      si = (si + 1) % statuses.length;
      const el = document.getElementById(`${cardId}-status`);
      if (el) el.textContent = statuses[si];
    }, 2200);

    try {
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 8192,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          system: "You are a senior equity analyst. Always respond with only a valid JSON object, no markdown, no preamble.",
          messages: [{ role: "user", content: buildPrompt(ticker, depth, focusAreas) }]
        })
      });

      clearInterval(statusInterval);
      const data = await response.json();

      if (!response.ok) throw new Error(data.error?.message || 'API error');

      // Extract text from response (may have tool_use blocks)
      const textBlocks = (data.content || []).filter(b => b.type === 'text');
      const rawText = textBlocks.map(b => b.text).join('');

      let parsed;
      try {
        const clean = rawText.replace(/```json|```/g, '').trim();
        parsed = JSON.parse(clean);
      } catch {
        // Attempt recovery: truncated JSON — try to salvage what was returned
        parsed = recoverPartialJSON(rawText);
        if (!parsed) throw new Error('Could not parse response as JSON. Raw: ' + rawText.slice(0, 200));
      }

      loadingEl.remove();
      renderAnalysisCard(parsed, rawText, cardId);

      // Add to history
      history.unshift({ ticker, time: new Date().toLocaleTimeString(), cardId, data: parsed });
      renderHistory();

    } catch (err) {
      clearInterval(statusInterval);
      loadingEl.remove();
      const errEl = document.createElement('div');
      errEl.className = 'error-card';
      errEl.innerHTML = `<strong>${ticker}</strong> — Analysis failed: ${err.message}`;
      main.prepend(errEl);
    }
  }

  function renderAnalysisCard(d, rawText, cardId) {
    const main = document.getElementById('mainContent');
    const verdictClass = { BULLISH: 'verdict-bullish', BEARISH: 'verdict-bearish', NEUTRAL: 'verdict-neutral' }[d.verdict] || 'verdict-neutral';

    const sentimentClass = { good: 'sentiment-good', neutral: 'sentiment-neutral', caution: 'sentiment-caution', bad: 'sentiment-bad' };
    const metricsLegend = `<div class="metrics-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Good</div>
      <div class="legend-item"><div class="legend-dot" style="background:#818cf8"></div>Neutral</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>Caution</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Bad</div>
    </div>`;
    const metricsHtml = (d.metrics || []).map(m => {
      const sc = sentimentClass[m.sentiment] || '';
      return `<div class="metric-cell ${sc}">
        <div class="metric-name">${esc(m.name)}</div>
        <div class="metric-value">${esc(m.value)}</div>
      </div>`;
    }).join('');

    const risksHtml = (d.risks || []).map(r => `
      <div class="risk-item"><div class="risk-dot"></div><div>${esc(r)}</div></div>`).join('');

    const card = document.createElement('div');
    card.className = 'analysis-card';
    card.id = cardId;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-ticker">${esc(d.ticker)}</div>
          <div class="card-name">${esc(d.companyName || '')}</div>
        </div>
        <div class="card-verdict ${verdictClass}">${esc(d.verdict || 'N/A')}</div>
      </div>
      <div class="card-body">
        <div>
          <div class="section-label">Thesis</div>
          <div class="section-text">${esc(d.thesis || '—')}</div>
        </div>
        ${risksHtml ? `<div>
          <div class="section-label">Key Risks</div>
          <div class="risks-list">${risksHtml}</div>
        </div>` : ''}
        ${metricsHtml ? `<div>
          <div class="section-label">Key Metrics</div>
          ${metricsLegend}
          <div class="metrics-grid">${metricsHtml}</div>
        </div>` : ''}
        <div>
          <div class="section-label" style="display:flex;align-items:center;">
            Verdict
            <button class="raw-toggle" onclick="toggleRaw('${cardId}')">raw JSON</button>
          </div>
          <div class="verdict-box"><p>${esc(d.verdictSummary || '—')}</p></div>
          <div class="raw-output" id="${cardId}-raw" style="display:none;margin-top:10px;">${esc(rawText)}</div>
        </div>
      </div>
    `;
    main.prepend(card);
  }

  function toggleRaw(cardId) {
    const el = document.getElementById(cardId + '-raw');
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<p class="no-history">No analyses yet</p>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="history-item" onclick="scrollToCard('${h.cardId}')">
        <span class="history-ticker">${h.ticker}</span>
        <span style="font-size:11px;color:var(--muted)">${h.data?.verdict || ''}</span>
        <span class="history-time">${h.time}</span>
      </div>`).join('');
  }

  function scrollToCard(cardId) {
    const el = document.getElementById(cardId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function runAnalysis() {
    const raw = document.getElementById('tickers').value;
    const tickers = parseTickers(raw);
    if (!tickers.length) {
      alert('Please enter at least one ticker symbol.');
      return;
    }

    const btn = document.getElementById('analyzeBtn');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div>&nbsp;Analysing…';

    const depth = selectedDepth;
    const focus = new Set(selectedFocus);

    for (const ticker of tickers) {
      await analyzeStock(ticker, depth, focus);
    }

    btn.disabled = false;
    btnText.textContent = 'Analyze';
  }

  // Enter key shortcut
  document.getElementById('tickers').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) runAnalysis();
  });
</script>
</body>
</html>
